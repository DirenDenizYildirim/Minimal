# EXPERIMENT 1 (freeze lift 1) — is the S = 3 survival advantage the CAPABILITY,
# or the hand-designed rows?
#
# Pre-registered at docs/preregistration/searched-s3-pursuer.md, commit 577f15a.
# GENERATED by scripts/build_pursuer_searched_s3_configs.py — edit that, not this.
#
# Claim G4 is graded SUGGESTED because every S = 3 row in the record is a guess:
# B1, B2 and B3 are hand-written points in six-, ten- and twelve-constant spaces,
# and §5 showed what that costs when it read B2 scoring below B3 as "more sensing
# hurts". Six searched rows — two objectives x three optimiser seeds, each started
# AT B1-ternary's own constants — turn the question into one a search can answer:
# is there better, and does the answer depend on which objective you ask for?
#
# All nine rows are in ONE sweep so every comparison pairs by run index on
# identical seeds. Evaluation seed 20260904, disjoint from the training base
# 930000, so no row is scored on anything it was trained on.
#
# READ SURVIVAL AS MEAN PER-ROBOT SURVIVAL WITH A WILSON INTERVAL, not as a
# median of `survival_fraction`. §12.1 D0 moved the record onto the per-robot
# statistic because the median of a per-run proportion at n = 20 can only land on
# a twentieth: that is how the blind row at 0.47 R came to be published as
# "0.00 [0.00, 0.23]" when 36% of its robots survive.
#
# SATURATION. `survival_fraction` and `capture_rate` both pin once a swarm is
# wiped out. Check the wiped-out share before quoting either, and read
# `time_to_wipeout` in the lethal cells.
#
# THE GRID is `pursuer_pareto.toml`'s: the cells §12 reads the two-axis trade-off
# off, where survival has to be plotted against what surviving cost. h = 1.93 s
# throughout, and kappa = 3.0 appears here and nowhere else.

name = "pursuer-searched-s3-pareto"
base = "../gauci_baseline.toml"
runs_per_cell = 100

[[axis]]
path = "pursuer.range"
values = [0.2, 0.35, 1.0]

[[axis]]
path = "pursuer.confusion"
values = [0.0, 3.0]

[[axis]]
path = "pursuer.handling_time"
values = [1.93]

[[rows]]
label = "B0-blind"
[rows.overrides]
"sim.duration" = 120.0
"pursuer.speed_ratio" = 1.5
"pursuer.confusion_radius" = 0.5
"sensor.encoding" = "binary"
controller = { kind = "gauci", constants = [-0.7, -1.0, 1.0, -1.0], provenance = "enumerated" }

[[rows]]
label = "B1-ternary"
[rows.overrides]
"sim.duration" = 120.0
"pursuer.speed_ratio" = 1.5
"pursuer.confusion_radius" = 0.5
"sensor.encoding" = "ternary"
controller = { kind = "table", memory_bits = 0, provenance = "hand_designed", entries = [
  { wheels = [-0.700000, -1.000000] },
  { wheels = [1.000000, -1.000000] },
  { wheels = [-1.000000, -1.000000] },
] }

[[rows]]
label = "D-dispersive"
[rows.overrides]
"sim.duration" = 120.0
"pursuer.speed_ratio" = 1.5
