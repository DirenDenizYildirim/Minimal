# IDEA A, H3 (first capability row) — does a terrain bit buy back the peak?
#
# Three rows on the same grid, evaluated on seeds DISJOINT from the ones the
# searches trained on (training seed base 900000; evaluation uses the base
# config's 20260904).
#
#   S2-gauci      c = (2,0,0,0), Gauci's four constants. Enumerated, so this is
#                 the one TIGHT row here.
#   S2-searched   c = (2,0,0,0), same four constants re-searched.            (†)
#   S4-terrain    c = (4,0,0,0), binary LOS x binary terrain bit, eight
#                 constants.                                                 (†)
#
# S2-searched is the control that makes the comparison mean anything. Without
# it, any S4 advantage could simply be "searched" rather than "more sensing" --
# the two rows were given the SAME optimiser (sep-CMA-ES), the SAME budget (600
# evaluations x 12 runs = 7200 simulation runs each) and the SAME training
# seeds, so the difference between them is the extra state and nothing else.
#
# Both searched rows are UPPER BOUNDS and carry †. sep-CMA-ES is not exhaustive
# and, being diagonal-only, is a weaker searcher than full CMA-ES; that only
# loosens the bound.
#
# lambda: the peak located by H2 (0.10 m, lambda/R0 = 0.69) plus two flanking
# values. theta_m runs to 0.9, the top of the valid range.
#
# Reported as paired panels: REACH probability (ever_single_cluster -- did they
# ever form one cluster) and HOLD ratio (final dispersion / that row's own
# theta_m = 0 cell). They answer different questions and the terrain dials move
# them differently.

name = "terrain-h3-capability"
base = "../gauci_baseline.toml"
runs_per_cell = 100

[[axis]]
path = "terrain.correlation_length"
values = [0.05, 0.1, 0.2]

[[axis]]
path = "terrain.friction_amplitude"
values = [0.0, 0.2, 0.4, 0.6, 0.9]

[[rows]]
label = "S2-gauci"
[rows.overrides]
"sensor.encoding" = "binary"
controller = { kind = "gauci", constants = [-0.7, -1.0, 1.0, -1.0], provenance = "enumerated" }

[[rows]]
label = "S2-searched"
[rows.overrides]
"sensor.encoding" = "binary"
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.285218, -0.949495] },
  { wheels = [0.935379, -0.226159] },
] }

[[rows]]
label = "S4-terrain"
# Rows are (nothing|seen) x (smooth|rough); the terrain bit is the high bit and
# its threshold defaults to the field median so the bit is ~50/50.
[rows.overrides]
"sensor.encoding" = "binary_with_terrain"
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.236416, -0.519837] },
  { wheels = [0.797842, -0.406434] },
  { wheels = [-0.186302, -0.965739] },
  { wheels = [0.930956, -0.450512] },
] }
