#
# Drawn from numpy.random.default_rng(20260910), the sampling seed recorded in
# docs/preregistration/pseudo-reality.md BEFORE the draw. Six parameters,
# consumed in the order that file's table lists them, model-major:
#
#   noise.wheel_noise                0.027496   (default 0.000000)
#   occlusion.fn_rate                0.067444   (default 0.000000)
#   occlusion.fp_rate                0.017931   (default 0.000000)
#   sim.collision_iterations               32   (default 32)
#   sim.contact_tolerance        5.480441e-06   (default 1.000000e-05)
#   sim.dt                           0.050000   (default 0.100000)
#
# Everything else -- kinematics, traction model, pursuer lock-on law, sensor
# geometry -- is the baseline's and is identical in every model. This family
# perturbs how carefully the simulator is integrated and how noisy its sensors
# are, NOT whether the model is right.
#
# Below this line the file is configs/gauci_baseline.toml verbatim, comments
# included, with the six lines above substituted. Those comments describe the
# BASELINE, so every substituted line is marked `# PERTURBED` -- read the
# marker, not the prose above it.
# --------------------------------------------------------------------------
# Week-1 gate: the clean arena.
#
# Gauci, Chen, Li, Dodd & Gross (2014), IJRR, "Self-organized aggregation
# without computation": one binary line-of-sight sensor, no memory, no
# arithmetic, four wheel constants found by exhaustive grid search.
#
# This is the only row in the project whose minimum is TIGHT rather than an
# upper bound, and it is the reference every hostility dial is measured against.
# Nothing here may be changed to make a later result look better; see
# docs/validation.md.

[robot]
# e-puck as modelled in Enki by Gauci et al. (2014): disk of diameter 7.4 cm,
# inter-wheel distance 5.1 cm, wheel velocities in [-12.8, 12.8] cm/s. Verified
# against the paper; these reproduce its published R0 = 14.45 cm, omega_0 = 0.75
# and omega_1 = 5.02 rad/s exactly. Not free parameters.
radius = 0.037
axle_length = 0.051
max_wheel_speed = 0.128

[swarm]
n = 20

[swarm.init]
shape = "disk"
# Start radius derived from coverage, so initial density is constant across n
# and the scaling curve in n is interpretable.
coverage = 0.05

[sim]
dt = 0.050000  # PERTURBED, baseline 0.100000 -- the comment above describes the baseline
duration = 600.0
seed = 20260904
collisions = true
collision_iterations = 32  # PERTURBED, baseline 32 (a Rust default the baseline does not spell out)
contact_tolerance = 5.480441e-06  # PERTURBED, baseline 1.000000e-05 (a Rust default the baseline does not spell out)

[sensor]
# Unlimited range with a zero-width ray, as in Gauci's simulation. Occlusion by
# nearer bodies is inherent: the nearest body in the cone is what is returned.
fov_half_angle = 0.0
encoding = "binary"

[controller]
kind = "gauci"
constants = [-0.7, -1.0, 1.0, -1.0]
# Gauci's four-constant grid was exhaustive at its resolution, so this row —
# alone in the project — reports a tight minimum rather than an upper bound.
provenance = "enumerated"

[occlusion]
# Clean arena.
fn_rate = 0.067444  # PERTURBED, baseline 0.000000 -- the comment above describes the baseline
fp_rate = 0.017931  # PERTURBED, baseline 0.000000 -- the comment above describes the baseline

[terrain]
# Flat board.
slope_angle = 0.0
friction_amplitude = 0.0

[metrics]
cluster_link_radii = 3.0
sample_interval = 10.0

[noise]
# Per-wheel actuation noise, as a fraction of max wheel speed. Zero here: the
# reference baseline is the noise-free idealisation. It is a dial to sweep, not
# a correction to apply — see docs/decisions/0004-baseline-actuation-noise.md.
wheel_noise = 0.027496  # PERTURBED, baseline 0.000000 -- the comment above describes the baseline
