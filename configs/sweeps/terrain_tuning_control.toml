# EXPERIMENT 1 — the 2x2 tuning control.
#
# Section 9 concluded "re-tuning solves it", but that conflated two things.
# S2-rough (formerly "S2-searched") was tuned against THIS objective — median
# final dispersion at n = 20, tau = 600 s, start radius 0.74 m, under this
# repository's normalisation and collision model — while Gauci's constants were
# found for a different one. So "S2-rough beats Gauci everywhere" could mean
# "tuned for this objective beats not tuned for it", with terrain playing no part.
#
# S2-flat is the missing cell: same optimiser, same budget (600 evaluations x 12
# runs), same training seed base (900000, disjoint from these evaluation seeds),
# differing from S2-rough ONLY in the theta_m of its training condition.
#
#   S2-gauci   published constants, tuned for neither this objective nor terrain
#   S2-flat    tuned for this objective at theta_m = 0                        (†)
#   S2-rough   tuned for this objective at theta_m = 0.9                      (†)
#
# PRE-REGISTERED DECISION RULE:
#   (a) S2-flat degrades with theta_m like Gauci while S2-rough holds
#       -> terrain moves the optimal parameters; correction #11 stands with its
#          baseline corrected from Gauci to S2-flat.
#   (b) S2-flat and S2-rough overlap in CI at every theta_m
#       -> terrain does not move the optimum; it is a performance tax on a fixed
#          controller. #11 is rewritten, and the H2 degradation curve is
#          re-attributed to Gauci's specific constants rather than to terrain
#          sensitivity in general.
#   (c) they cross
#       -> a trade-off exists; report the crossing theta_m and reopen the terrain
#          bit as a next-list item.
#
# Grid and seeds identical to terrain_retune_cost.toml (section 9).

name = "terrain-tuning-control"
base = "../gauci_baseline.toml"
runs_per_cell = 100

[[axis]]
path = "terrain.friction_amplitude"
values = [0.0, 0.1, 0.2, 0.3, 0.45, 0.6, 0.75, 0.9]

[[rows]]
label = "S2-gauci"
[rows.overrides]
"terrain.correlation_length" = 0.1
"sensor.encoding" = "binary"
controller = { kind = "gauci", constants = [-0.7, -1.0, 1.0, -1.0], provenance = "enumerated" }

[[rows]]
label = "S2-flat"
[rows.overrides]
"terrain.correlation_length" = 0.1
"sensor.encoding" = "binary"
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.328887, -0.892324] },
  { wheels = [0.998251, -0.658854] },
] }

[[rows]]
label = "S2-rough"
[rows.overrides]
"terrain.correlation_length" = 0.1
"sensor.encoding" = "binary"
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.285218, -0.949495] },
  { wheels = [0.935379, -0.226159] },
] }
