[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-harness"
version = "0.1.0"
description = "Sweep aggregation and figures for Minimal Swarms in Hostile Environments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
# Friedman + post-hoc across capability rows, which the ANTS/Birattari-lab
# protocol expects. See docs/statistics.md.
stats = ["scipy>=1.10"]

[project.scripts]
swarm-figure = "swarm_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
