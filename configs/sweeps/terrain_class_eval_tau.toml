# QUESTION B, EXPERIMENT 3, COMPANION -- the tau extension on the cells the
# decision rule turns on.
#
# On section 14's grid at tau = 600 s the class-searched rows beat Gauci almost
# everywhere and lose in exactly two cells: start radius 3.0 m under terrain, at
# both swarm sizes. Section 14 already showed that this is the cell where a 600 s
# budget truncates the slower rows -- extending tau sixfold there moved S2-flat's
# paired ratio from 0.296 to 1.297 while S2-rough's did not move at all. Whether
# the class rows FAIL there or are merely SLOW is therefore not answerable at
# tau = 600 s, and the verdict on question B turns on it.
#
# Same cell, all five rows, tau = 600, 1800 and 3600 s, both swarm sizes.
# 100 runs/cell, same evaluation seeds.

name = "terrain-class-eval-tau"
base = "../gauci_baseline.toml"
runs_per_cell = 100

[[axis]]
path = "terrain.friction_amplitude"
values = [0.9]

[[axis]]
path = "swarm.init.radius"
values = [3.0]

[[axis]]
path = "sim.duration"
values = [600.0, 1800.0, 3600.0]

[[axis]]
path = "swarm.n"
values = [20, 50]

[[rows]]
label = "S2-gauci"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "gauci", constants = [-0.7, -1.0, 1.0, -1.0], provenance = "enumerated" }

[[rows]]
label = "S2-flat"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.328887, -0.892324] },
  { wheels = [0.998251, -0.658854] },
] }

[[rows]]
label = "S2-rough"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.285218, -0.949495] },
  { wheels = [0.935379, -0.226159] },
] }

[[rows]]
label = "S2-class-flat"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.432983, -0.882043] },
  { wheels = [0.792395, -0.886538] },
] }

[[rows]]
label = "S2-class-rough"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.249091, -0.909332] },
  { wheels = [0.862019, -0.628348] },
] }
