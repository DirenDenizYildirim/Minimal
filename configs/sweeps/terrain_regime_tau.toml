# EXPERIMENT 2, part 3 -- is the collapse a failure, or only slowness?
#
# Part 1 found the searched rows inverted against Gauci at start radius 3.0 m
# under terrain: reach 0.11 (S2-rough) and 0.23 (S2-flat) against Gauci's 0.46,
# median dispersion 38.0 and 19.5 against Gauci's 3.9. All of that was measured
# at tau = 600 s.
#
# The tau probe that justified keeping tau = 600 s everywhere was run at
# theta_m = 0, where every row reaches a cluster in every run and dispersion has
# converged by 600 s. It says nothing about the cell that produced the
# inversion. And there is a specific reason to doubt it there: on FLAT ground at
# this radius the searched rows already take 280 s and 330 s to first reach a
# cluster against Gauci's 140 s, so they are 2x slower to gather before terrain
# is applied at all. A 600 s budget could be truncating them rather than
# defeating them, and "slower" is a different claim from "worse".
#
# tau = 600, 1800 and 3600 s, applied to ALL THREE ROWS in the cell so the
# comparison stays matched, and at BOTH swarm sizes, since n = 50 at this radius
# also fails to reach in 21-38% of runs at tau = 600 s and would otherwise be
# half-checked. 100 runs/cell, same evaluation seeds.
#
# If the inversion survives to 3600 s it is a failure. If Gauci's advantage
# closes as tau grows, part 1's headline must be restated as a rate result.

name = "terrain-regime-tau"
base = "../gauci_baseline.toml"
runs_per_cell = 100

[[axis]]
path = "terrain.friction_amplitude"
values = [0.9]

[[axis]]
path = "swarm.init.radius"
values = [3.0]

[[axis]]
path = "swarm.n"
values = [20, 50]

[[axis]]
path = "sim.duration"
values = [600.0, 1800.0, 3600.0]

[[rows]]
label = "S2-gauci"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "gauci", constants = [-0.7, -1.0, 1.0, -1.0], provenance = "enumerated" }

[[rows]]
label = "S2-flat"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.328887, -0.892324] },
  { wheels = [0.998251, -0.658854] },
] }

[[rows]]
label = "S2-rough"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.285218, -0.949495] },
  { wheels = [0.935379, -0.226159] },
] }
