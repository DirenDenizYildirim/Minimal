# NEXT-LIST ITEM 8, COMPANION -- the 3.0 m column at the trial length it needs.
#
# At tau = 600 s the reference row itself reaches a cluster in 46% of runs at
# 3.0 m, n = 20, theta_m = 0.9, so that cell measures gathering rate rather than
# holding and cannot decide anything. Same cell, all four rows, tau = 600, 1800
# and 3600 s, both swarm sizes, same evaluation seeds. This is the sweep the
# verdict is read from; it repeats section 19's companion with the new row added.

name = "terrain-class-tau-eval-tau"
base = "../gauci_baseline.toml"
runs_per_cell = 100

[[axis]]
path = "terrain.friction_amplitude"
values = [0.9]

[[axis]]
path = "swarm.init.radius"
values = [3.0]

[[axis]]
path = "sim.duration"
values = [600.0, 1800.0, 3600.0]

[[axis]]
path = "swarm.n"
values = [20, 50]

[[rows]]
label = "S2-gauci"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "gauci", constants = [-0.7, -1.0, 1.0, -1.0], provenance = "enumerated" }

[[rows]]
label = "S2-class-flat"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.432983, -0.882043] },
  { wheels = [0.792395, -0.886538] },
] }

[[rows]]
label = "S2-class-rough"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.249091, -0.909332] },
  { wheels = [0.862019, -0.628348] },
] }

[[rows]]
label = "S2-class-rough-tau"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.236719, -0.874006] },
  { wheels = [0.739824, -0.240389] },
] }
