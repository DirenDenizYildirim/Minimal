# EXPERIMENT 3 (freeze lift 1) — the tuning control at a second and third lambda.
#
# Pre-registered at docs/preregistration/lambda-tuning-control.md (d6c40c8).
#
# A2 and A3 decompose the gap between the enumerated row and a terrain-tuned one
# at ONE correlation length, lambda = 0.10 m, which is also the lambda every
# terrain sweep in the record has used since section 4 located the peak there.
# This sweep asks whether the decomposition depends on that choice, by re-running
# terrain_tuning_control.toml's three rows unchanged at lambda = 0.05 m and
# 0.20 m -- a factor of two either side, straddling the peak (lambda/R0 = 0.35
# and 1.38 for Gauci's R0 = 14.45 cm).
#
# NOTHING IS RE-SEARCHED. The three rows below are copied verbatim from
# terrain_tuning_control.toml, down to the constants. Re-searching at each lambda
# would answer a different and much more expensive question ("does a controller
# tuned at this lambda do better here"), and would destroy the pairing that makes
# this a control. The cost is stated in the pre-registration and must be repeated
# wherever the result is: this measures TRANSFER of a lambda = 0.10-tuned
# controller, not the decomposition a lambda-matched controller would show.
#
# The rows still carry `terrain.correlation_length = 0.1` verbatim; the axis
# below overrides it, which is the documented order of application (sweep.rs,
# test `an_axis_overrides_a_row_setting_the_same_path`). Keeping the row block
# byte-identical to the existing file is worth more than tidying a line that has
# no effect: a diff of the two configs shows the lambda axis and nothing else.
#
# Seeds: base 20260904 from gauci_baseline.toml, the SAME base as
# terrain_tuning_control.toml, with n, coverage, tau, dt and the theta_m grid
# also identical -- so run i is the same placement at every lambda and the new
# cells pair by run index against the existing ones.
#
# PRE-REGISTERED DECISION RULE (per lambda; the three lambdas are not pooled):
#   A3 HOLDS at that lambda if the paired terrain-tuning interval
#     -- the per-run difference D(S2-flat) - D(S2-rough) at theta_m = 0.9 --
#     includes zero there.
#   A3 FAILS at that lambda if it excludes zero. Direction is reported either
#     way: excluding zero ABOVE narrows A3 (terrain-tuning buys something real
#     at that lambda); excluding zero BELOW is a STRONGER result than A3 and
#     must not be filed as a mere failure.
#   The matched-controller cost is reported as a RANGE across the three lambdas,
#     replacing the single-lambda 10-20% A2 currently quotes.
#   The theta_m = 0.6 crossing is reported if present but not claimed unless it
#     is disjoint from zero at more than one lambda.

name = "terrain-tuning-control-lambda"
base = "../gauci_baseline.toml"
runs_per_cell = 100

[[axis]]
path = "terrain.correlation_length"
values = [0.05, 0.20]

[[axis]]
path = "terrain.friction_amplitude"
values = [0.0, 0.1, 0.2, 0.3, 0.45, 0.6, 0.75, 0.9]

[[rows]]
label = "S2-gauci"
[rows.overrides]
"terrain.correlation_length" = 0.1
"sensor.encoding" = "binary"
controller = { kind = "gauci", constants = [-0.7, -1.0, 1.0, -1.0], provenance = "enumerated" }

[[rows]]
label = "S2-flat"
[rows.overrides]
"terrain.correlation_length" = 0.1
"sensor.encoding" = "binary"
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.328887, -0.892324] },
  { wheels = [0.998251, -0.658854] },
] }

[[rows]]
label = "S2-rough"
[rows.overrides]
"terrain.correlation_length" = 0.1
"sensor.encoding" = "binary"
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.285218, -0.949495] },
  { wheels = [0.935379, -0.226159] },
] }
