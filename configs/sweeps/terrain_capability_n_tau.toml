"sensor.encoding" = "binary_with_terrain"
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.236416, -0.519837] },
  { wheels = [0.797842, -0.406434] },
  { wheels = [-0.186302, -0.965739] },
