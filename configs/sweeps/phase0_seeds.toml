# PHASE 0 -- baseline hardening. Is S2-class-flat a reproduced optimum, or one
# draw from a scattered distribution of optimiser outcomes?
#
# S2-class-flat is the c*(theta) baseline (section 19) and was found by ONE
# optimiser seed. docs/statistics.md asks for two independent optimisers, or
# failing that independent runs of the same one, with their agreement reported;
# section 19's own limitation list and next-list item 12 both name this.
#
# Seeds 2 and 3 repeat the seed-1 search under the IDENTICAL protocol:
# sep-CMA-ES, 1200 x 12, the six-condition class (start radius {0.74, 1.5, 3.0} m
# x n {20, 50}), theta_m = 0, geometric mean of the per-condition medians, and
# the SAME training seed base (910000). Only the optimiser seed differs, so the
# spread between the three rows is the optimiser's own variability and nothing
# else.
#
# Evaluated here on section 14's full held-out grid, tau = 600 s as on that
# grid. The 3.0 m theta_m = 0.9 column is truncated for every row equally at
# that tau -- section 19 showed Gauci itself reaches in only 46% of runs there --
# so the companion sweep phase0_seeds_tau.toml re-runs that column at tau = 600,
# 1800 and 3600 s, which is where any comparison against Gauci in that column is
# read from.
#
# DECISION RULE, pre-registered:
#   (a) all three within CI of each other on every held-out cell AND R0 within
#       10% -> the baseline is a reproduced optimum; next-list item 12 closes;
#       seed 1 stays the baseline unless another seed dominates it, in which case
#       the dominant one becomes the baseline and the section says so;
#   (b) they scatter -> the baseline becomes best-of-three per cell (the
#       framework's best-known-S=2-per-cell rule), the scatter is reported as the
#       baseline's uncertainty, and every c*(theta) number downstream is stated
#       against best-of-three.

name = "phase0-seeds"
base = "../gauci_baseline.toml"
runs_per_cell = 100

[[axis]]
path = "terrain.friction_amplitude"
values = [0.0, 0.9]

[[axis]]
path = "swarm.init.radius"
values = [0.74, 1.5, 3.0]

[[axis]]
path = "swarm.n"
values = [20, 50]

[[rows]]
label = "S2-gauci"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "gauci", constants = [-0.7, -1.0, 1.0, -1.0], provenance = "enumerated" }

[[rows]]
label = "S2-class-flat-s1"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.432983, -0.882043] },
  { wheels = [0.792395, -0.886538] },
] }

[[rows]]
label = "S2-class-flat-s2"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.542573, -0.980003] },
  { wheels = [0.946660, -0.811344] },
] }

[[rows]]
label = "S2-class-flat-s3"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.409734, -0.752740] },
  { wheels = [0.732649, -0.606024] },
] }
