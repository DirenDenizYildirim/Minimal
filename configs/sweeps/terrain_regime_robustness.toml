# EXPERIMENT 2 — do the searched controllers' advantages survive outside the
# initial condition they were tuned in?
#
# S2-flat and S2-rough were both searched at n = 20, start radius 0.74 m,
# tau = 600 s. Section 13's decomposition — 97% objective-tuning — is a statement
# about that regime and nowhere else. If the advantage over Gauci collapses at a
# larger start radius or a larger swarm, section 9's comparison was
# regime-specific and correction #11 cannot be finalised from it.
#
# TAU. Checked, not assumed: a probe at the largest start radius (3.0 m, n = 20,
# theta_m = 0, 30 runs/cell) run at tau = 600, 1800, 3600 and 7200 s gives reach
# 1.00 at every tau for all three rows, and dispersion converged by 600 s
# (gauci 1.38 -> 1.40, flat 1.23 -> 1.18, rough 1.30 -> 1.21). tau = 600 s is
# therefore kept everywhere, which also keeps every cell comparable to section 13.
#
# Start radius 0.74 m is the tuned condition; 1.5 m and 3.0 m are 2x and 4x that,
# i.e. 4x and 16x the start area at fixed n.

name = "terrain-regime-robustness"
base = "../gauci_baseline.toml"
runs_per_cell = 100

[[axis]]
path = "terrain.friction_amplitude"
values = [0.0, 0.9]

[[axis]]
path = "swarm.init.radius"
values = [0.74, 1.5, 3.0]

[[axis]]
path = "swarm.n"
values = [20, 50]

[[rows]]
label = "S2-gauci"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "gauci", constants = [-0.7, -1.0, 1.0, -1.0], provenance = "enumerated" }

[[rows]]
label = "S2-flat"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.328887, -0.892324] },
  { wheels = [0.998251, -0.658854] },
] }

[[rows]]
label = "S2-rough"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.285218, -0.949495] },
  { wheels = [0.935379, -0.226159] },
] }
