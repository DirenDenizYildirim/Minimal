# DIAGNOSTIC, not an experiment. No claim rests on this file.
#
# Freeze lift 1, finding F3: the four single-condition searches do not regenerate
# from the recorded protocol, because no section states their optimiser seed. The
# published constants stay the rows of record -- every downstream evaluation
# hard-codes them and reproduces. This file answers one narrower question: are
# those published rows TYPICAL draws from the protocol, or unusually good ones?
#
# Each searched row is scored against its own TRAINING cell, next to the
# controller that the same protocol returns at optimiser seed 1:
#
#   S2-rough  (published, and re-run)  theta_m = 0.9, lambda = 0.10 m
#   S2-flat   (published, and re-run)  theta_m = 0.0, lambda = 0.10 m
#
# theta_m sits in the row overrides rather than on an axis because the two pairs
# are scored at different amplitudes; crossing them would score each controller
# on the other's cell as well, which is not the question.
#
# 100 runs/cell on the evaluation seed 20260904, held out from the training base
# 900000, and paired by run index across all four rows -- one base seed, so run i
# is the same placement everywhere.
#
# If the published row and the re-run row are within each other's CI, the
# published constants are an ordinary draw and F3 costs the record nothing beyond
# the missing provenance. If the re-run is disjointly better, the published row
# is a weak draw and that belongs in the disclosure.

name = "f3-seed1-rerun-sanity"
base = "../gauci_baseline.toml"
runs_per_cell = 100

[[axis]]
path = "sim.duration"
values = [600.0]

[[rows]]
label = "S2-rough-published"
[rows.overrides]
"terrain.correlation_length" = 0.1
"terrain.friction_amplitude" = 0.9
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.285218, -0.949495] },
  { wheels = [0.935379, -0.226159] },
] }

[[rows]]
label = "S2-rough-rerun-seed1"
[rows.overrides]
"terrain.correlation_length" = 0.1
"terrain.friction_amplitude" = 0.9
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.149817, -0.953012] },
  { wheels = [0.522278, -0.201075] },
] }

[[rows]]
label = "S2-flat-published"
[rows.overrides]
"terrain.correlation_length" = 0.1
"terrain.friction_amplitude" = 0.0
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.328887, -0.892324] },
  { wheels = [0.998251, -0.658854] },
] }

[[rows]]
label = "S2-flat-rerun-seed1"
[rows.overrides]
"terrain.correlation_length" = 0.1
"terrain.friction_amplitude" = 0.0
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.317834, -0.830648] },
  { wheels = [0.578635, -0.430918] },
] }
