# QUESTION A, EXPERIMENT 2 -- does the peak correlation length track the body?
#
# Run because experiment 1 fired the fixed-length-scale branch: doubling R0 moved
# the peak by 1.39x [0.72, 1.93], an interval that excludes the ratio law's 2.00
# and contains 1.00. Section 15 noted that the shared peak, 7.46 cm, sits within
# 1% of the 7.4 cm body diameter. This is the direct test of that coincidence.
#
# Body diameter at 3.7, 7.4 and 14.8 cm, with R0 (14.45 cm), the axle (5.1 cm),
# the sensor model and the START RADIUS held at base values. Same lambda grid as
# experiment 1, theta_m in {0, 0.9}, n = 20, tau = 600 s, 100 runs/cell.
#
# WHAT CANNOT BE HELD, and is therefore stated rather than hidden. Body diameter
# is not an isolated dial; four things move with it:
#
#   1. Start radius is pinned to 0.74 m so it does not follow the body, which
#      means the PACKING FRACTION does: 0.0125, 0.05 and 0.20 at n = 20. Holding
#      both is impossible.
#   2. The cluster link distance is 3 body radii, so the aggregation criterion
#      scales with the body. Dispersion is itself normalised by robot radius
#      squared, and the hold ratio divides two dispersions at the same body size,
#      so the metric used here cancels both -- which is why the hold ratio is the
#      right statistic for this sweep and absolute dispersion is not.
#   3. Line-of-sight occlusion: a larger body blocks more of the arena. The
#      sensor's own parameters are unchanged; its geometry cannot be.
#   4. At a 3.7 cm diameter the 5.1 cm axle puts the wheel contacts OUTSIDE the
#      body, exactly as the wide-axle row in section 11 does.
#
# So both the 3.7 cm and 14.8 cm rows are numerical devices, not buildable
# robots, and carry the double dagger for geometry as well as for constants.
#
# DECISION RULE, pre-registered: if peak lambda tracks body diameter -- slope
# near 1 on log-log with a CI excluding 0 -- record the length scale AS the body
# diameter and propose no mechanism for it. If it does not track, record 7.46 cm
# as a fixed scale of unknown origin and put its origin on the next list. Either
# way, no third mechanism in this pass.

name = "terrain-lambda-body"
base = "../gauci_baseline.toml"
runs_per_cell = 100

[[axis]]
path = "terrain.friction_amplitude"
values = [0.0, 0.9]

[[axis]]
path = "terrain.correlation_length"
values = [0.02, 0.0278, 0.0386, 0.0537, 0.0746, 0.1036, 0.1439, 0.2, 0.2779, 0.3861]

[[rows]]
label = "body-half"
[rows.overrides]
"robot.radius" = 0.0185
"swarm.init.radius" = 0.74
controller = { kind = "gauci", constants = [-0.7, -1.0, 1.0, -1.0], provenance = "hand_designed" }

[[rows]]
label = "body-base"
[rows.overrides]
"robot.radius" = 0.037
"swarm.init.radius" = 0.74
controller = { kind = "gauci", constants = [-0.7, -1.0, 1.0, -1.0], provenance = "enumerated" }

[[rows]]
label = "body-x2"
[rows.overrides]
"robot.radius" = 0.074
"swarm.init.radius" = 0.74
controller = { kind = "gauci", constants = [-0.7, -1.0, 1.0, -1.0], provenance = "hand_designed" }
