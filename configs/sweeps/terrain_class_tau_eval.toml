# NEXT-LIST ITEM 8, THE PART SECTION 19 LEFT OPEN -- does a transferring
# rough-trained row exist once the training objective is no longer truncated?
#
# Section 19's S2-class-rough did not move R0 at all (4.74 -> 4.47 cm) while the
# flat-trained class row moved 5.53 -> 7.47 cm and became the c*(theta) baseline.
# Section 19 attributed that to a truncated training objective rather than to
# anything about rough training: the search ran every condition at tau = 600 s,
# and at 3.0 m under terrain almost no candidate aggregates in 600 s, so the two
# hardest conditions contributed a near-constant penalty with no gradient in it.
#
# S2-class-rough-tau is the same search with tau = 3600 s at the 3.0 m
# conditions, the trial length those conditions are EVALUATED at. Same budget
# (1200 x 12), same optimiser seed (1), and the SAME TRAINING SEED BASE (920000)
# as S2-class-rough, so trial length is the only difference between the two rows.
#
# Rows: the enumerated reference, section 19's baseline, section 19's rough class
# row, and the new one. The single-condition rows S2-flat and S2-rough are not
# repeated -- section 19 already reports them on this grid with these seeds.
#
# tau = 600 s here, as on section 14's main grid; the 3.0 m column is decided by
# the companion sweep terrain_class_tau_eval_tau.toml, because at 600 s Gauci
# itself reaches a cluster in only 46% of runs there.

name = "terrain-class-tau-eval"
base = "../gauci_baseline.toml"
runs_per_cell = 100

[[axis]]
path = "terrain.friction_amplitude"
values = [0.0, 0.9]

[[axis]]
path = "swarm.init.radius"
values = [0.74, 1.5, 3.0]

[[axis]]
path = "swarm.n"
values = [20, 50]

[[rows]]
label = "S2-gauci"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "gauci", constants = [-0.7, -1.0, 1.0, -1.0], provenance = "enumerated" }

[[rows]]
label = "S2-class-flat"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.432983, -0.882043] },
  { wheels = [0.792395, -0.886538] },
] }

[[rows]]
label = "S2-class-rough"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.249091, -0.909332] },
  { wheels = [0.862019, -0.628348] },
] }

[[rows]]
label = "S2-class-rough-tau"
[rows.overrides]
"terrain.correlation_length" = 0.1
controller = { kind = "table", memory_bits = 0, provenance = "optimiser_found", entries = [
  { wheels = [-0.236719, -0.874006] },
  { wheels = [0.739824, -0.240389] },
] }
